apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Values.environment }}
  labels:
    {{- include "tasky.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: tasky-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          args: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          readinessProbe:
            httpGet:
              path: /healthz/
              port: {{ .Values.api.port }}
              httpHeaders:
              - name: Host
                value: tasky-api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz/
              port: {{ .Values.api.port }}
              httpHeaders:
              - name: Host
                value: tasky-api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Values.environment }}
  labels:
    {{- include "tasky.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: 8000
      targetPort: {{ .Values.api.port }}
