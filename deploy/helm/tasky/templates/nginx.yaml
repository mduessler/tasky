apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nginx
  namespace: {{ .Values.environment }}
  labels:
    {{- include "tasky.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-nginx
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-nginx
    spec:
      containers:
        - name: tasky-nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - containerPort: 80
            - containerPort: 443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz/
              port: 443
              httpHeaders:
                - name: Host
                  value: tasky-api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 30
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz/
              port: 443
              httpHeaders:
                - name: Host
                  value: tasky-api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nginx
  namespace: {{ .Values.environment }}
  labels:
    {{- include "tasky.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Release.Name }}-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
