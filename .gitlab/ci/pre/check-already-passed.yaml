check-already-passed:
  stage: .pre
  image: alpine
  tags:
    - dev
  script:
    - apk add --no-cache curl jq
    - |
      COUNT=$(curl -sf --header "PRIVATE-TOKEN: $CI_API_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines?sha=$CI_COMMIT_SHA&status=success" | jq 'length')
      echo "Found $COUNT prior successful pipeline(s) for $CI_COMMIT_SHA"
      echo "ALREADY_PASSED=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> gate.env
  artifacts:
    reports:
      dotenv: gate.env
.skip-if-passed:
  needs: [check-already-passed]
  before_script:
    - if [ "$ALREADY_PASSED" = "true" ]; then echo "Already tested commit. Skipping check"; exit 0; fi
