test:django-readyness:
  extends: .prod:test-base
  variables:
    ENV_FILE: .env.ci
    DJANGO_SETTINGS_MODULE: task_management_system.settings.production
    DJANGO_ALLOWED_HOSTS: localhost
    SECRET_KEY: "ci-test-only-not-a-real-secret-padding-0123456789abcdef"
    JWT_SECRET_KEY: "ci-test-only-jwt-not-a-real-secret-padding-0123456789"
  before_script:
    - |
      cat > "$ENV_FILE" <<EOF
      DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      SECRET_KEY=${SECRET_KEY}
      JWT_SECRET_KEY=${JWT_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      EOF
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "$PROD_IMAGE"
  script:
    - ./prod/tests/test-django-readiness
