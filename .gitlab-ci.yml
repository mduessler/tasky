stages:
  - build-dev
  - lint
  - test
  - security-dev
  - build
  - security
variables:
  DEV_IMAGE: $CI_REGISTRY_IMAGE/dev:$CI_COMMIT_SHORT_SHA
  DEV_IMAGE_LATEST: $CI_REGISTRY_IMAGE/dev:latest
  PROD_IMAGE: $CI_REGISTRY_IMAGE/prod:$CI_COMMIT_SHORT_SHA
  PROD_IMAGE_LATEST: $CI_REGISTRY_IMAGE/prod:latest
  PROD_NGINX_IMAGE: $CI_REGISTRY_IMAGE/prod-nginx:$CI_COMMIT_SHORT_SHA
  PROD_NGINX_IMAGE_LATEST: $CI_REGISTRY_IMAGE/prod-nginx:latest
include:
  - local: .gitlab/ci/build-jobs/dev/image.yaml
  - local: .gitlab/ci/lint-jobs/lint.yaml
  - local: .gitlab/ci/lint-jobs/openapi.yaml
  - local: .gitlab/ci/test-jobs/base.yaml
  - local: .gitlab/ci/test-jobs/registration.yaml
  - local: .gitlab/ci/test-jobs/task.yaml
  - local: .gitlab/ci/test-jobs/tms_auth.yaml
  - local: .gitlab/ci/test-jobs/user.yaml
  - local: .gitlab/ci/test-jobs/task_management_system.yaml
  - local: .gitlab/ci/security-jobs/trivy.yaml
  - local: .gitlab/ci/security-jobs/dev/pip-audit.yaml
  - local: .gitlab/ci/build-jobs/prod/image.yaml
  - local: .gitlab/ci/build-jobs/prod/nginx-image.yaml
  - local: .gitlab/ci/security-jobs/prod/trivy.yaml
