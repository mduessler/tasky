[tool.poetry]
name = "TaskManager"
version = "0.1.0"
description = "A simple task management system."
authors = ["Max Düssler", "max.duessler@posteo.net"]

[tool.poetry.dependencies]
python = ">=3.13.0 <3.14"
django = "6.0.5"
psycopg = {version = "3.2.5", extras = ["binary"]}
loguru = "0.7.3"
pyjwt = "2.12.1"
cryptography = "46.0.7"
djangorestframework = "3.17.1"
drf-spectacular = "0.29.0"
djangorestframework-simplejwt = "5.5.1"
django-celery-beat = "2.9.0"
redis = "7.4.0"
urllib3 = "2.7.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "4.6.0"
pytest = "9.0.3"
black = "26.3.1"
flake8 = "7.1.2"
mypy = "1.15.0"
bandit = "1.8.3"
isort = "6.0.1"
pytest-django = "4.10.0"
types-requests = "2.33.0.20260518"
freezegun = "1.5.5"
pytest-xdist = "3.8.0"
pytest-mock = "3.15.1"
factory-boy = "3.3.3"
pip-audit = "2.10.0"
pytest-timeout = "2.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.packages]]
include = "task_management_system"

[tool.isort]
profile = "black"
line_length = 99
multi_line_output = 3
known_first_party = "poetry"

[tool.black]
line-length = 99

[tool.flake8]
max-line-length = 99
max-doc-length = 99
ignore = [
    "E203",
    "D401",
    "D101",
    "D106",
    "D102",
    "D104",
    "E721",
    "D100",
    "D107",
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "task_management_system.task_management_system.settings"
