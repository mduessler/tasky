- name: Install gitlab-runner dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
    state: present
    update_cache: true
    lock_timeout: 600
- name: Get gitlab-runner script to install repository
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh
    dest: /tmp/gitlab-runner.script.deb.sh
    mode: "0744"
- name: Install gitlab-runner repository
  ansible.builtin.command: bash /tmp/gitlab-runner.script.deb.sh
  args:
    creates: /etc/apt/sources.list.d/runner_gitlab-runner.list
- name: Install gitlab-runner-helper-images
  ansible.builtin.apt:
    name: "gitlab-runner-helper-images={{ gitlab_runner_version }}"
    state: present
    update_cache: true
    lock_timeout: 600
- name: Install gitlab-runner
  ansible.builtin.apt:
    name: "gitlab-runner={{ gitlab_runner_version }}"
    state: present
    update_cache: true
    lock_timeout: 600
- name: Register gitlab-runner
  ansible.builtin.shell:
    cmd: |
      gitlab-runner register \
        --url "https://gitlab.com" \
        --token "{{ runner_token }}" \
        --executor "docker" \
        --docker-image "alpine:latest" \
        --name "{{ runner_name }}" \
        --non-interactive
    creates: /etc/gitlab-runner/config.toml
  no_log: false
- name: Verify gitlab-runner is running
  ansible.builtin.systemd:
    name: gitlab-runner
    state: started
    enabled: true
