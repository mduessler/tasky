# Connection method
ansible_connection: aws_ssm
ansible_aws_ssm_region: "eu-central-1"
ansible_aws_ssm_profile: "tasky-dev"
# SSM file-transfer bucket (created by terraform runner stack)
ansible_aws_ssm_bucket_name: "tasky-ansible-ssm-{{ lookup('env', 'TF_VAR_owner_id') }}-dev"
ansible_become: true
