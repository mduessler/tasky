- name: Configure gitlab-runner
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Wait for SSM connection
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 10
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait --long
      changed_when: false
    - name: Mask apt auto-update units
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - apt-daily.service
        - apt-daily-upgrade.service
        - unattended-upgrades.service
      failed_when: false
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - gitlab_runner
    - docker
