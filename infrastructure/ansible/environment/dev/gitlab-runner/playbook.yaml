- name: Configure gitlab-runner
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Wait for SSM connection
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 10
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait --long
      changed_when: false
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - gitlab_runner
