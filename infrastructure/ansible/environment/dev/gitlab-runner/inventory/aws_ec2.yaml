plugin: community.aws.aws_ssm
aws_profile: tasky-dev
regions:
  - "eu-central-1"
filters:
  tag:Project: "tasky"
  tag:Role: gitlab-runner
  tag:Environment: dev
  tag:RunnerName: "{{ runner_name }}"
compose:
  ansible_host: instance_id
keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""
