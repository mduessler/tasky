openapi: 3.0.3
info:
  title: Tasky API
  version: 1.0.0
  description: A collaborative task management REST API with JWT authentication.
paths:
  /api/auth/activate/:
    post:
      operationId: api_auth_activate_create
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateWriteRequest'
        required: true
      security:
        - jwtAuth: []
        - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateRead'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JWTTokenObtainPairRequest'
        required: true
      security:
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWTTokenObtainPairResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JWTLogoutRequest'
        required: true
      security:
        - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWTLogout'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JWTRefreshRequest'
        required: true
      security:
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWTRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: api_auth_register_create
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWriteRequest'
        required: true
      security:
        - jwtAuth: []
        - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterRead'
          description: ''
  /api/v1/membership/:
    get:
      operationId: membership_list
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - membership
      security:
        - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskMembershipReadList'
          description: ''
  /api/v1/membership/{id}/:
    get:
      operationId: membership_retrieve
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task membership.
          required: true
      tags:
        - membership
      security:
        - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMembershipRead'
          description: ''
    patch:
      operationId: membership_partial_update
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task membership.
          required: true
      tags:
        - membership
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskMembershipWriteRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMembershipRead'
          description: ''
    delete:
      operationId: membership_destroy
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task membership.
          required: true
      tags:
        - membership
      security:
        - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/note/:
    get:
      operationId: note_list
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - note
      security:
        - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskNoteReadList'
          description: ''
  /api/v1/note/{id}/:
    get:
      operationId: note_retrieve
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task note.
          required: true
      tags:
        - note
      security:
        - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNoteRead'
          description: ''
    patch:
      operationId: note_partial_update
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task note.
          required: true
      tags:
        - note
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskNoteWriteRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskNoteRead'
          description: ''
    delete:
      operationId: note_destroy
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task note.
          required: true
      tags:
        - note
      security:
        - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/task/:
    get:
      operationId: task_list
      parameters:
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - task
      security:
        - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskReadList'
          description: ''
    post:
      operationId: task_create
      tags:
        - task
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWriteRequest'
        required: true
      security:
        - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
          description: ''
  /api/v1/task/{id}/:
    get:
      operationId: task_retrieve
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task.
          required: true
      tags:
        - task
      security:
        - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
          description: ''
    patch:
      operationId: task_partial_update
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task.
          required: true
      tags:
        - task
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskWriteRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
          description: ''
    delete:
      operationId: task_destroy
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task.
          required: true
      tags:
        - task
      security:
        - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/task/{id}/membership/:
    post:
      operationId: task_membership_create
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task.
          required: true
      tags:
        - task
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskMembershipWriteRequest'
        required: true
      security:
        - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMembershipRead'
          description: ''
  /api/v1/task/{id}/memberships/:
    get:
      operationId: task_memberships_list
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task.
          required: true
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
      tags:
        - task
      security:
        - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskMembershipReadList'
          description: ''
  /api/v1/task/{id}/note/:
    post:
      operationId: task_note_create
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this task.
          required: true
      tags:
        - task
      requestBody:
        content:
          application/json:
            schema:
